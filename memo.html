<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="다솜이네" />
  <title>메모장 — 다솜이네</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="apple-touch-icon-precomposed" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&family=Hi+Melody&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/guard.js"></script>
  <style>
    /* 온글잎 긍정 — 자체 호스팅 (fonts/Ownglyph_Geungjeong.ttf) */
    @font-face {
      font-family: 'Ownglyph Geungjeong';
      src: url('fonts/Ownglyph_Geungjeong.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    /* ─── 작성자 색상 ─── */
    :root {
      --au-mom:    #f7a8a8;
      --au-mom-s:  #ffe0e0;
      --au-dad:    #a8c8ec;
      --au-dad-s:  #dfeefb;
      --au-da:     #f7d976;
      --au-da-s:   #fff5b1;
    }

    /* ─── 작은 포스트잇 그리드 (제목만 표시) ─── */
    .memo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 18px;
      padding: 14px 8px 100px; /* 하단 글쓰기 버튼에 안 가리도록 여백 */
    }

    .memo-mini {
      position: relative;
      background: #fff5b1;
      padding: 22px 14px 14px;
      min-height: 108px;
      border-radius: 4px;
      box-shadow:
        0 1px 1px rgba(0,0,0,0.04),
        0 4px 10px rgba(0,0,0,0.10);
      font-family: 'Ownglyph Geungjeong', 'Hi Melody', 'Gaegu', 'Gowun Dodum', 'Apple SD Gothic Neo', '돋움', sans-serif;
      color: #1a1216;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border: none;
      text-align: left;
      width: 100%;
    }
    .memo-mini:hover {
      transform: translateY(-4px);
      box-shadow: 0 3px 8px rgba(0,0,0,0.08), 0 10px 18px rgba(0,0,0,0.12);
    }
    .memo-mini::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 50px;
      height: 14px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .memo-mini.author-mom   { background: #ffe2e2; }
    .memo-mini.author-dad   { background: #e1eef9; }
    .memo-mini.author-dasom { background: #fff5b1; }

    .memo-mini .author-tag {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .memo-mini.author-mom   .author-tag { background: var(--au-mom); color: #fff; }
    .memo-mini.author-dad   .author-tag { background: var(--au-dad); color: #fff; }
    .memo-mini.author-dasom .author-tag { background: var(--au-da);  color: #6b5400; }

    .memo-mini .mini-title {
      font-size: 17px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ─── 하단 "글쓰기" 버튼 ─── */
    .fab-write {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      padding: 14px 34px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 100%);
      color: #fff;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 19px;
      font-weight: 700;
      box-shadow: 0 10px 26px rgba(0,0,0,0.2);
      cursor: pointer;
      z-index: 40;
      transition: transform .15s, box-shadow .15s;
    }
    .fab-write:hover { transform: translateX(-50%) translateY(-2px); }
    .fab-write:active { transform: translateX(-50%) translateY(0); box-shadow: 0 6px 16px rgba(0,0,0,0.18); }

    /* ─── 모달 공통 (calendar.html과 동일 패턴) ─── */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(80, 60, 70, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn .2s ease-out;
    }
    .modal-bg.open { display: flex; }
    @keyframes fadeIn { from { opacity: 0;} to { opacity: 1;} }

    .modal {
      background: #fff;
      border-radius: 24px;
      width: min(480px, 92%);
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px 26px 26px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.18);
      border: 3px solid var(--accent-soft);
      animation: pop .25s cubic-bezier(.5,1.6,.5,1);
      position: relative;
    }
    @keyframes pop {
      from { transform: scale(.85); opacity: 0;}
      to   { transform: scale(1);   opacity: 1;}
    }
    .modal h2 {
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      color: var(--accent-deep);
      margin: 0 0 16px;
      font-size: 26px;
    }

    /* ─── 새 메모 작성 폼 (write 모달 안) ─── */
    .form-section + .form-section { margin-top: 14px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-deep);
      margin-bottom: 8px;
    }

    .title-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid var(--accent-soft);
      border-radius: 12px;
      background: var(--paper);
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 17px;
      color: #4a3a41;
      outline: none;
      transition: all .15s;
    }
    .title-input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    /* 작성자 버튼 */
    .author-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .author-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 2px solid var(--accent-soft);
      background: var(--paper);
      border-radius: 999px;
      cursor: pointer;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #5a4651;
      transition: all .15s;
    }
    .author-btn:hover {
      background: #fff;
      transform: translateY(-2px);
    }
    .author-btn .au-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      display: inline-block;
    }
    .author-btn[data-author="mom"]   .au-dot { background: var(--au-mom); }
    .author-btn[data-author="dad"]   .au-dot { background: var(--au-dad); }
    .author-btn[data-author="dasom"] .au-dot { background: var(--au-da); }
    .author-btn.selected[data-author="mom"]   { background: var(--au-mom-s); border-color: var(--au-mom); }
    .author-btn.selected[data-author="dad"]   { background: var(--au-dad-s); border-color: var(--au-dad); }
    .author-btn.selected[data-author="dasom"] { background: var(--au-da-s);  border-color: var(--au-da);  }

    /* 이미지 피커 */
    .image-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
      gap: 6px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.55);
      border: 2px dashed var(--accent-soft);
      border-radius: 14px;
      max-height: 200px;
      overflow-y: auto;
    }
    .image-picker button {
      border: 2px solid transparent;
      background: #fff;
      border-radius: 8px;
      padding: 4px;
      cursor: pointer;
      transition: all .15s;
      aspect-ratio: 1;
    }
    .image-picker button:hover {
      border-color: var(--accent);
      transform: scale(1.05);
    }
    .image-picker img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* 부모 button이 이벤트 받게 */
    }

    /* 본문 에디터 */
    .memo-editor {
      min-height: 130px;
      padding: 16px 18px;
      border: 2px solid var(--accent-soft);
      border-radius: 14px;
      background: var(--paper);
      font-family: 'Ownglyph Geungjeong', 'Hi Melody', 'Gaegu', 'Gowun Dodum', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 22px;
      color: #1a1216;
      outline: none;
      line-height: 1.55;
      letter-spacing: 0.3px;
      transition: all .15s;
      word-break: break-word;
    }
    .memo-editor:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .memo-editor img {
      max-width: 100px;
      max-height: 100px;
      vertical-align: middle;
      margin: 2px 4px;
      border-radius: 6px;
    }
    .memo-editor.empty:before {
      content: attr(data-placeholder);
      color: #c2a3b0;
      pointer-events: none;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 26px;
      border: none;
      border-radius: 999px;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all .15s;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-deep); }
    .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.ghost {
      background: transparent;
      color: #8a6f7a;
      border: 2px solid var(--accent-soft);
    }
    .btn.ghost:hover { background: var(--accent-soft); }

    /* ─── 확대 보기(view) 모달: 큰 포스트잇 ─── */
    .memo-view {
      padding: 38px 26px 26px;
    }
    .memo-view::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%) rotate(-3deg);
      width: 80px;
      height: 20px;
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .memo-view.author-mom   { background: #ffe2e2; border-color: var(--au-mom); }
    .memo-view.author-dad   { background: #e1eef9; border-color: var(--au-dad); }
    .memo-view.author-dasom { background: #fff5b1; border-color: var(--au-da); }

    .memo-view .author-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .memo-view.author-mom   .author-tag { background: var(--au-mom); color: #fff; }
    .memo-view.author-dad   .author-tag { background: var(--au-dad); color: #fff; }
    .memo-view.author-dasom .author-tag { background: var(--au-da);  color: #6b5400; }

    .memo-view .view-title {
      font-family: 'Ownglyph Geungjeong', 'Hi Melody', 'Gaegu', sans-serif;
      font-size: 28px;
      margin: 0 0 14px;
      color: #1a1216;
      word-break: break-word;
    }
    .memo-view .memo-body {
      font-family: 'Ownglyph Geungjeong', 'Hi Melody', 'Gaegu', 'Gowun Dodum', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 22px;
      line-height: 1.55;
      letter-spacing: 0.3px;
      white-space: pre-wrap;
      word-break: break-word;
      color: #1a1216;
    }
    .memo-view .memo-body img {
      max-width: 120px;
      max-height: 120px;
      vertical-align: middle;
      margin: 2px 4px;
      border-radius: 6px;
    }
    .memo-view .memo-time {
      margin-top: 16px;
      font-size: 12px;
      color: #8a7a6f;
      text-align: right;
    }
    .memo-view .memo-del {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.08);
      color: #555;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      transition: all .15s;
    }
    .memo-view .memo-del:hover { background: #c97070; color: #fff; }

    @media (max-width: 640px) {
      .fab-write { padding: 13px 28px; font-size: 17px; }
      .memo-view .view-title { font-size: 24px; }
      .memo-view .memo-body { font-size: 19px; }
    }
  </style>
</head>
<body class="theme-memo">

  <header class="app-header">
    <div class="brand">
      <img src="11/dasom.png" alt="" />
      <span>다솜이네</span>
    </div>
    <button id="logout" class="logout-btn">나가기</button>
  </header>

  <nav class="main-nav">
    <a href="home.html" class="nav-link">다솜이네</a>
    <a href="calendar.html" class="nav-link">달력</a>
    <a href="todo.html" class="nav-link">해야 할일</a>
    <a href="memo.html" class="nav-link active">메모장</a>
  </nav>

  <main class="page">
    <section class="card">
      <h1 class="page-title">📝 메모장</h1>

      <!-- 저장된 메모: 제목만 보이는 작은 포스트잇 -->
      <div class="memo-grid" id="memoGrid"></div>
    </section>
  </main>

  <footer class="app-footer">made with ♥ for 다솜이네 가족</footer>

  <!-- 글쓰기 버튼 -->
  <button type="button" class="fab-write" id="btnOpenWrite">✏️ 글쓰기</button>

  <!-- 새 메모 작성 모달 -->
  <div class="modal-bg" id="writeModalBg" aria-hidden="true">
    <div class="modal" role="dialog" aria-labelledby="writeModalTitle">
      <h2 id="writeModalTitle">✏️ 새 메모</h2>
      <form id="memoForm" autocomplete="off">
        <div class="form-section">
          <label class="form-label">작성자</label>
          <div class="author-row">
            <button type="button" class="author-btn" data-author="mom"><span class="au-dot"></span>엄마</button>
            <button type="button" class="author-btn" data-author="dad"><span class="au-dot"></span>아빠</button>
            <button type="button" class="author-btn" data-author="dasom"><span class="au-dot"></span>다솜</button>
          </div>
        </div>

        <div class="form-section">
          <label class="form-label" for="memoTitleInput">제목</label>
          <input type="text" id="memoTitleInput" class="title-input" placeholder="제목을 적어주세요" maxlength="40" />
        </div>

        <div class="form-section" id="imagePickerSection" hidden>
          <label class="form-label">이미지 (눌러서 본문에 추가)</label>
          <div class="image-picker" id="imagePicker"></div>
        </div>

        <div class="form-section">
          <label class="form-label" for="memoEditor">본문</label>
          <div class="memo-editor empty" id="memoEditor" contenteditable="true"
               data-placeholder="메모를 적어주세요" spellcheck="false"></div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn ghost" id="btnCloseWrite">닫기</button>
          <button type="button" class="btn ghost" id="btnReset">지우기</button>
          <button type="submit" class="btn primary" id="btnSave">저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 메모 확대 보기 모달 -->
  <div class="modal-bg" id="viewModalBg" aria-hidden="true">
    <div class="modal memo-view" id="viewCard" role="dialog" aria-labelledby="viewTitleText">
      <button type="button" class="memo-del" id="viewDeleteBtn" title="삭제" aria-label="삭제">🗑</button>
      <span class="author-tag" id="viewAuthorTag"></span>
      <h2 class="view-title" id="viewTitleText"></h2>
      <div class="memo-body" id="viewBody"></div>
      <div class="memo-time" id="viewTime"></div>
      <div class="form-actions">
        <button type="button" class="btn ghost" id="btnCloseView">닫기</button>
      </div>
    </div>
  </div>

  <script type="module">
  /* ───────────────────────────────────────────
   * 다솜이네 — 메모장 (Firestore 연동)
   * dasom_memos 컬렉션에 실시간 동기화됩니다.
   * 목록에는 제목만 보이는 작은 포스트잇을 보여주고,
   * 누르면 큰 포스트잇 모달로 확대해서 본문을 보여줍니다.
   * ─────────────────────────────────────────── */
  import {
    db, COLS,
    collection, doc,
    addDoc, deleteDoc,
    onSnapshot, serverTimestamp,
    ensureSignedIn,
  } from './js/firebase-init.js';

  // 인증 보장 — 실패해도(Discord 로그인은 서버가 이미 확인했으므로) 억지로 로그아웃시키지 않음
  try {
    await ensureSignedIn();
  } catch (e) {
    console.error('Firebase 익명 인증 실패 (일시적일 수 있음)', e);
  }

  (function () {
    'use strict';

    // 작성자 ↔ 이미지 폴더 매핑
    const AUTHORS = {
      mom: {
        label: '엄마',
        folder: '14',
        files: ['11.png','12.png','13.png','14.png','15.png','16.png',
                '21.png','22.png','23.png','24.png','25.png','26.png'],
      },
      dad: {
        label: '아빠',
        folder: '13',
        files: ['11.png','12.png','13.png','14.png','15.png','16.png','17.png','18.png'],
      },
      dasom: {
        label: '다솜',
        folder: '12',
        files: ['b1.png','b2.png','b3.png','b4.png','b5.png','b6.png','b7.png',
                'b8.png','b9.png','b10.png','b11.png','b12.png','b13.png'],
      },
    };

    const memosRef = collection(db, COLS.memos);

    // ─── DOM: 목록 / 글쓰기 버튼 ───
    const grid = document.getElementById('memoGrid');
    const btnOpenWrite = document.getElementById('btnOpenWrite');

    // ─── DOM: 글쓰기 모달 ───
    const writeModalBg = document.getElementById('writeModalBg');
    const form = document.getElementById('memoForm');
    const titleInput = document.getElementById('memoTitleInput');
    const editor = document.getElementById('memoEditor');
    const authorRow = form.querySelector('.author-row');
    const pickerSection = document.getElementById('imagePickerSection');
    const picker = document.getElementById('imagePicker');
    const btnSave = document.getElementById('btnSave');
    const btnReset = document.getElementById('btnReset');
    const btnCloseWrite = document.getElementById('btnCloseWrite');

    // ─── DOM: 확대 보기 모달 ───
    const viewModalBg = document.getElementById('viewModalBg');
    const viewCard = document.getElementById('viewCard');
    const viewAuthorTag = document.getElementById('viewAuthorTag');
    const viewTitleText = document.getElementById('viewTitleText');
    const viewBody = document.getElementById('viewBody');
    const viewTime = document.getElementById('viewTime');
    const viewDeleteBtn = document.getElementById('viewDeleteBtn');
    const btnCloseView = document.getElementById('btnCloseView');

    let selectedAuthor = null;
    let cache = [];

    // ─── 글쓰기 모달 열기/닫기 ───
    function openWrite() {
      writeModalBg.classList.add('open');
      writeModalBg.setAttribute('aria-hidden', 'false');
      setTimeout(() => {
        try { titleInput.focus(); } catch (e) { /* ignore */ }
      }, 100);
    }
    function closeWrite() {
      writeModalBg.classList.remove('open');
      writeModalBg.setAttribute('aria-hidden', 'true');
    }
    btnOpenWrite.addEventListener('click', openWrite);
    btnCloseWrite.addEventListener('click', closeWrite);
    writeModalBg.addEventListener('click', (e) => {
      if (e.target === writeModalBg) closeWrite();
    });

    // ─── 확대 보기 모달 열기/닫기 ───
    function openView(m) {
      const meta = AUTHORS[m.author] || AUTHORS.dasom;
      const title = (m.title && m.title.trim()) || deriveTitle(m.html) || '(제목 없음)';
      const safe = sanitizeHtml(m.html || '');
      const time = m.createdAt && m.createdAt.toDate ? formatDate(m.createdAt.toDate()) : '';

      viewCard.className = 'modal memo-view author-' + (m.author || 'dasom');
      viewAuthorTag.textContent = meta.label;
      viewTitleText.textContent = title;
      viewBody.innerHTML = safe;
      viewTime.textContent = time;

      viewDeleteBtn.onclick = async () => {
        if (!confirm('이 메모를 삭제할까요?')) return;
        try {
          await deleteDoc(doc(db, COLS.memos, m.id));
          closeView();
        } catch (err) {
          console.error(err);
          alert('삭제에 실패했어요: ' + err.message);
        }
      };

      viewModalBg.classList.add('open');
      viewModalBg.setAttribute('aria-hidden', 'false');
    }
    function closeView() {
      viewModalBg.classList.remove('open');
      viewModalBg.setAttribute('aria-hidden', 'true');
    }
    viewModalBg.addEventListener('click', (e) => {
      if (e.target === viewModalBg) closeView();
    });
    btnCloseView.addEventListener('click', closeView);

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (writeModalBg.classList.contains('open')) closeWrite();
      if (viewModalBg.classList.contains('open')) closeView();
    });

    // ─── 작성자 선택 ───
    authorRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.author-btn');
      if (!btn) return;
      const a = btn.dataset.author;
      if (selectedAuthor === a) {
        // 토글: 같은 버튼 다시 누르면 해제
        selectedAuthor = null;
        btn.classList.remove('selected');
        pickerSection.hidden = true;
        return;
      }
      selectedAuthor = a;
      authorRow.querySelectorAll('.author-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderPicker(a);
    });

    function renderPicker(authorKey) {
      const meta = AUTHORS[authorKey];
      picker.innerHTML = '';
      meta.files.forEach(f => {
        const b = document.createElement('button');
        b.type = 'button';
        b.title = `${meta.folder}/${f}`;
        const img = document.createElement('img');
        img.src = `${meta.folder}/${f}`;
        img.alt = '';
        b.appendChild(img);
        // mousedown 으로 default 막아 contenteditable 포커스 보존
        b.addEventListener('mousedown', (ev) => ev.preventDefault());
        b.addEventListener('click', () => insertImage(`${meta.folder}/${f}`));
        picker.appendChild(b);
      });
      pickerSection.hidden = false;
    }

    // ─── 본문 에디터 ───
    function updateEmpty() {
      const html = editor.innerHTML.replace(/<br\s*\/?>/gi, '').trim();
      editor.classList.toggle('empty', html === '');
    }
    editor.addEventListener('input', updateEmpty);
    editor.addEventListener('focus', updateEmpty);

    function insertImage(src) {
      editor.focus();
      const img = document.createElement('img');
      img.src = src;
      img.alt = '';
      const sel = window.getSelection();
      let inserted = false;
      if (sel && sel.rangeCount) {
        const range = sel.getRangeAt(0);
        if (editor.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          range.insertNode(img);
          // 커서를 이미지 뒤로 이동
          range.setStartAfter(img);
          range.setEndAfter(img);
          sel.removeAllRanges();
          sel.addRange(range);
          inserted = true;
        }
      }
      if (!inserted) {
        editor.appendChild(img);
        // 커서 끝으로
        const range = document.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        const sel2 = window.getSelection();
        sel2.removeAllRanges();
        sel2.addRange(range);
      }
      updateEmpty();
    }

    // ─── 저장 / 초기화 ───
    function resetForm() {
      editor.innerHTML = '';
      updateEmpty();
      titleInput.value = '';
      // 작성자 선택은 유지 (연달아 같은 사람 메모 쓰기 편하게)
    }

    btnReset.addEventListener('click', () => {
      resetForm();
      editor.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedAuthor) {
        alert('작성자를 먼저 선택해주세요.');
        return;
      }
      const title = titleInput.value.trim();
      if (!title) {
        alert('제목을 입력해주세요.');
        titleInput.focus();
        return;
      }
      btnSave.disabled = true;
      try {
        const html = sanitizeHtml(editor.innerHTML);
        const plain = html.replace(/<[^>]+>/g, '').trim();
        const hasImg = /<img\s/i.test(html);
        if (!plain && !hasImg) {
          alert('내용을 입력해주세요.');
          return;
        }
        await addDoc(memosRef, {
          author: selectedAuthor,
          title,
          html,
          createdAt: serverTimestamp(),
        });
        resetForm();
        closeWrite();
      } catch (err) {
        // sanitizeHtml()의 예외까지 여기서 잡아서, 저장이 조용히 실패하는 대신
        // 항상 알림이 뜨도록 합니다.
        console.error(err);
        alert('저장에 실패했어요: ' + err.message);
      } finally {
        btnSave.disabled = false;
      }
    });

    // ─── HTML 정제 (보안: 텍스트 / <br> / <img src="12|13|14/..."> 만 허용) ───
    function sanitizeHtml(rawHtml) {
      const tmp = document.createElement('div');
      tmp.innerHTML = rawHtml;
      const validImgSrc = /^(?:12|13|14)\/[A-Za-z0-9_.\-]+\.(?:png|jpg|jpeg|webp|gif)$/i;

      // 형제 노드를 앞에서부터 한 번만 안전하게 훑으면서 정제합니다.
      function clean(node) {
        let child = node.firstChild;
        while (child) {
          if (child.nodeType === Node.TEXT_NODE) {
            child = child.nextSibling;
            continue;
          }
          if (child.nodeType !== Node.ELEMENT_NODE) {
            const next = child.nextSibling;
            child.remove();
            child = next;
            continue;
          }
          const tag = child.tagName.toLowerCase();
          if (tag === 'br') {
            child = child.nextSibling;
            continue;
          }
          if (tag === 'img') {
            const next = child.nextSibling;
            const src = child.getAttribute('src') || '';
            if (!validImgSrc.test(src)) {
              child.remove();
            } else {
              // 다른 속성 제거
              Array.from(child.attributes).forEach(attr => {
                if (attr.name !== 'src' && attr.name !== 'alt') {
                  child.removeAttribute(attr.name);
                }
              });
            }
            child = next;
            continue;
          }
          if (tag === 'div' || tag === 'p') {
            // 줄바꿈으로 변환 후 자식 노드만 보존하고,
            // 방금 끌어올린 내용부터 이어서 계속 정제합니다.
            const br = document.createElement('br');
            node.insertBefore(br, child);
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            child.remove();
            child = br;
            continue;
          }
          // 그 외 태그 → 텍스트만 살림
          const next = child.nextSibling;
          const text = document.createTextNode(child.textContent || '');
          node.replaceChild(text, child);
          child = next;
        }
      }
      clean(tmp);
      // 끝에 br 정리
      let html = tmp.innerHTML.replace(/(<br\s*\/?>\s*)+$/i, '').trim();
      return html;
    }

    // ─── 목록 렌더 (작은 포스트잇: 제목만) ───
    function tsSeconds(t) { return (t && t.seconds) || 0; }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // 제목 필드가 없던 옛 메모를 위한 대체 제목(본문 앞부분)
    function deriveTitle(html) {
      const text = (html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      if (!text) return '';
      return text.length > 18 ? text.slice(0, 18) + '…' : text;
    }

    function render() {
      grid.innerHTML = '';
      // 최근 작성 순
      const sorted = cache.slice().sort((a, b) => tsSeconds(b.createdAt) - tsSeconds(a.createdAt));
      sorted.forEach(m => {
        const meta = AUTHORS[m.author] || AUTHORS.dasom;
        const title = (m.title && m.title.trim()) || deriveTitle(m.html) || '(제목 없음)';

        const mini = document.createElement('button');
        mini.type = 'button';
        mini.className = 'memo-mini author-' + (m.author || 'dasom');
        mini.innerHTML = `
          <span class="author-tag">${meta.label}</span>
          <div class="mini-title">${escapeHtml(title)}</div>
        `;
        mini.addEventListener('click', () => openView(m));
        grid.appendChild(mini);
      });
    }

    function formatDate(d) {
      const yy = String(d.getFullYear()).slice(2);
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const mi = String(d.getMinutes()).padStart(2, '0');
      return `${yy}.${mm}.${dd} ${hh}:${mi}`;
    }

    // ─── 실시간 구독 ───
    onSnapshot(memosRef, (snap) => {
      cache = [];
      snap.forEach(d => cache.push({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error('[Firestore] memos onSnapshot error', err);
    });

    updateEmpty();
  })();
  </script>
</body>
</html>
