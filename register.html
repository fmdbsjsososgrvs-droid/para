<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>기기 등록 — 다솜이네</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #fff7fb 0%, #fef6e4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 32px 26px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.1);
      border: 3px solid #ffe0ec;
    }
    h1 {
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 26px;
      color: #d96a8a;
      margin: 0 0 6px;
    }
    p.sub { color: #8a6f7a; font-size: 13px; margin: 0 0 20px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #d96a8a; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 2px solid #ffd1dc;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffb6c1 0%, #ffc8a2 100%);
      color: #fff;
      font-family: 'Gaegu', 'Apple SD Gothic Neo', '돋움', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .msg { margin-top: 14px; font-size: 13px; color: #e06b86; white-space: pre-wrap; }
    .result {
      margin-top: 18px;
      display: none;
    }
    .result.show { display: block; }
    .result label { margin-top: 10px; }
    textarea {
      width: 100%;
      box-sizing: border-box;
      min-height: 90px;
      padding: 10px;
      border: 2px solid #ffd1dc;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
    }
    .copy-btn {
      margin-top: 8px;
      background: transparent;
      border: 2px solid #ffd1dc;
      color: #d96a8a;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🔐 새 기기 등록</h1>
    <p class="sub">이 페이지는 설정 코드가 있어야만 동작해요. Claude와 함께 등록할 때만 쓰세요.</p>

    <label for="label">이 기기 이름 (예: 다솜이 아이폰)</label>
    <input type="text" id="label" placeholder="다솜이 아이폰" maxlength="40" />

    <button type="button" id="btnRegister">여기서 Face ID / 지문 / YubiKey 등록</button>
    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <label>아래 값을 통째로 복사해서 Vercel의 WEBAUTHN_CREDENTIALS 환경변수에 붙여넣으세요</label>
      <textarea id="allCreds" readonly></textarea>
      <button type="button" class="copy-btn" id="btnCopy">복사하기</button>
    </div>
  </main>

  <script src="js/simplewebauthn-browser.js"></script>
  <script>
    (function () {
      const token = new URLSearchParams(location.search).get('token') || '';
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btnRegister');
      const labelInput = document.getElementById('label');
      const result = document.getElementById('result');
      const allCredsEl = document.getElementById('allCreds');

      if (!token) {
        msg.textContent = 'URL에 ?token=... 이 빠졌어요. Claude가 준 전체 링크로 들어와주세요.';
        btn.disabled = true;
      }

      if (!window.PublicKeyCredential || !window.SimpleWebAuthnBrowser) {
        msg.textContent = '이 브라우저는 패스키 등록을 지원하지 않아요.';
        btn.disabled = true;
      }

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        msg.textContent = '';
        result.classList.remove('show');
        try {
          const label = (labelInput.value || '새 기기').trim();
          const optRes = await fetch('/api/webauthn/register-options?token=' + encodeURIComponent(token) + '&label=' + encodeURIComponent(label));
          const options = await optRes.json();
          if (!optRes.ok) throw new Error(options.error || '등록 준비 실패');

          const regResponse = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: options });

          const verifyRes = await fetch('/api/webauthn/register-verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, response: regResponse }),
          });
          const verifyJson = await verifyRes.json();
          if (!verifyRes.ok) throw new Error(verifyJson.error || '등록 확인 실패');

          allCredsEl.value = verifyJson.allCredentialsJSON;
          result.classList.add('show');
          msg.style.color = '#4a8a5a';
          msg.textContent = '✅ 등록 성공! 아래 값을 복사해서 Vercel 환경변수에 넣어주세요.';
        } catch (e) {
          msg.style.color = '#e06b86';
          msg.textContent = '실패: ' + (e && e.message ? e.message : e);
        } finally {
          btn.disabled = false;
        }
      });

      document.getElementById('btnCopy').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(allCredsEl.value);
          msg.style.color = '#4a8a5a';
          msg.textContent = '복사했어요!';
        } catch (e) {
          allCredsEl.select();
        }
      });
    })();
  </script>
</body>
</html>
